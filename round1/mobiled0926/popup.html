<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>상세페이지 레퍼런스</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><p class="eyebrow">DETAIL PAGE TOOL</p><h1>레퍼런스 수집</h1><p class="description">현재 상품 페이지를 저장하고 이미지를 모읍니다.</p></header>
<section class="capture-card"><div><strong>전체 페이지 캡처</strong><span>긴 상세페이지를 PNG 한 장으로 저장</span></div><button id="capture-button" class="primary">캡처하기</button></section>
<section class="images-section"><div class="section-heading"><div><strong>참고 이미지</strong><span id="image-count">이미지를 찾는 중…</span></div><label class="select-all"><input id="select-all" type="checkbox" checked> 전체 선택</label></div><div id="image-list" class="image-list"></div><p id="empty-state" class="empty" hidden>다운로드할 만한 이미지를 찾지 못했어요.</p><button id="download-button" class="secondary" disabled>선택한 이미지 다운로드</button></section><p id="status" class="status" aria-live="polite"></p></main><script src="popup.js"></script></body></html>
