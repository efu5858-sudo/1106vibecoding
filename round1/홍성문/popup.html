<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>무드 브라우저</title><link rel="stylesheet" href="popup.css"><script defer src="popup.js"></script></head><body><header><span>MAKE YOUR OWN ATMOSPHERE</span><h1>무드 브라우저<span>✦</span></h1><p>오늘의 화면에 작은 즐거움을 더해요.</p></header><main><section><h2>01 / 날씨와 발자국</h2><label>날씨<select id="weather"><option value="off">끄기</option><option value="rain">비</option><option value="snow">눈</option><option value="petals">벚꽃</option></select></label><label>효과 강도<select id="intensity"><option value="light">은은하게</option><option value="medium">적당하게</option><option value="strong">풍성하게</option></select></label><label>클릭 효과<select id="paw"><option value="off">끄기</option><option value="dog">강아지 발바닥</option><option value="cat">고양이 발바닥</option></select></label><p class="hint">날씨를 켜고 5초간 쉬면 아래에 쌓여요. 아래쪽에서 마우스를 휘저어보세요! 일반 웹페이지에서 새로고침 후 적용됩니다.</p></section><section><h2>02 / 나에게 보내는 알람</h2><form id="alarm-form"><input id="alarm-title" placeholder="알람 내용" maxlength="100" aria-label="알람 내용" required><input id="alarm-time" type="datetime-local" aria-label="알람 날짜와 시간" required><button>알람 추가</button></form><ul id="alarms"></ul><p class="hint">크롬이 종료되어 놓친 알람은 다시 실행할 때 알려드려요.</p></section><section><h2>03 / 잊기 전에 메모</h2><textarea id="memo" rows="4" placeholder="자유롭게 적어보세요." aria-label="메모장"></textarea><p id="memo-status" class="hint">자동 저장</p></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
